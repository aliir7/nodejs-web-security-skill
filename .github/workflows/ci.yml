name: CI
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --package-lock=false
      - run: node --check bin/cli.js
      - run: node tests/smoke.mjs
      - run: npm pack --dry-run